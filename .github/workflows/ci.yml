name: Node CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t my-app .

    - name: Run container
      run: docker run -d -p 3000:3000 --name running-app my-app

    - name: Test app
      run: |
        sleep 3
        curl --fail http://localhost:3000
